name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [12, 13]
        include:
          - laravel: 12
            testbench: ^10.0
          - laravel: 13
            testbench: ^11.0
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: 13

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Report the resolved Laravel version
        run: php -r 'require "vendor/autoload.php"; echo Illuminate\Foundation\Application::VERSION, PHP_EOL;'

      - name: Run tests
        run: vendor/bin/pest --ci

  pint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    name: Frontend components

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the javascript starter components are present and wired
        run: |
          set -e
          for file in \
            resources/js/vue/pages/NotificationsIndex.vue \
            resources/js/react/pages/NotificationsIndex.jsx \
            resources/js/svelte/pages/NotificationsIndex.svelte
          do
            test -f "$file" || { echo "Missing $file"; exit 1; }
            grep -q "notifications" "$file" || { echo "$file does not reference the notification routes"; exit 1; }
          done

      - name: Check every css framework ships a blade view set
        run: |
          set -e
          for css in tailwind bootstrap5 bootstrap4; do
            for view in index send partials/bell; do
              test -f "resources/views/$css/blade/$view.blade.php" \
                || { echo "Missing resources/views/$css/blade/$view.blade.php"; exit 1; }
            done
          done
